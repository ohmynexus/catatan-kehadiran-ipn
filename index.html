<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c10">
<title>IPN NAMATOTA — Neon Attendance</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script>try{var _t=localStorage.getItem('ipna.theme');if(_t)document.documentElement.setAttribute('data-theme',_t)}catch(e){}</script>
<style>
/* ================= THEME ENGINE (4 TEMA PREMIUM) ================= */
:root,[data-theme="onyx"]{
  --bg:#0a0c10;--side:#0d1015;--card:#12151c;--card2:#161a22;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --acc1:#22d3ee;--acc2:#a78bfa;--soft1:rgba(34,211,238,.14);--soft2:rgba(167,139,250,.14);
  --text:#e8ecf3;--muted:#8b93a3;--inp:#0d1015;--thead-fg:#9aa3b2;--td:#cdd3dd;--btnfg:#052730;
  --shadow:0 14px 40px -18px rgba(0,0,0,.6);color-scheme:dark;
}
[data-theme="emerald"]{
  --bg:#0a0f0d;--side:#0c1210;--card:#101613;--card2:#141b17;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --acc1:#34d399;--acc2:#a3e635;--soft1:rgba(52,211,153,.14);--soft2:rgba(163,230,53,.12);
  --text:#e7efe9;--muted:#87968d;--inp:#0c1210;--thead-fg:#9db4a8;--td:#cfe0d6;--btnfg:#04241a;
  --shadow:0 14px 40px -18px rgba(0,0,0,.6);color-scheme:dark;
}
[data-theme="gold"]{
  --bg:#0e0c09;--side:#12100b;--card:#171410;--card2:#1c1813;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --acc1:#e3b458;--acc2:#e08b3c;--soft1:rgba(227,180,88,.14);--soft2:rgba(224,139,60,.12);
  --text:#f0e9dd;--muted:#a0988a;--inp:#12100b;--thead-fg:#bcab8d;--td:#e2d8c6;--btnfg:#241a08;
  --shadow:0 14px 40px -18px rgba(0,0,0,.65);color-scheme:dark;
}
[data-theme="porcelain"]{
  --bg:#f4f6f8;--side:#ffffff;--card:#ffffff;--card2:#f8fafc;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.16);
  --acc1:#4f46e5;--acc2:#0891b2;--soft1:rgba(79,70,229,.1);--soft2:rgba(8,145,178,.1);
  --text:#0f172a;--muted:#64748b;--inp:#ffffff;--thead-fg:#64748b;--td:#334155;--btnfg:#ffffff;
  --shadow:0 14px 40px -22px rgba(15,23,42,.25);color-scheme:light;
}
/* ================= BASE ================= */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:400 14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;
  transition:background .4s,color .4s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(55% 38% at 78% -8%,var(--soft1),transparent 70%),radial-gradient(40% 30% at 8% 108%,var(--soft2),transparent 70%)}
button{font-family:inherit}
.app{display:flex;min-height:100vh;position:relative;z-index:1}
/* ================= SIDEBAR (desktop) ================= */
.side{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:20px 14px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.slogo{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.logo{width:40px;height:40px;border-radius:12px;flex:none;background:var(--bg);border:1.5px solid var(--acc1);
  display:grid;place-items:center;font:800 10px 'Plus Jakarta Sans';letter-spacing:.08em;color:var(--text);position:relative;
  box-shadow:0 0 16px -6px var(--acc1)}
.logo::before{content:'';position:absolute;inset:3px;border:1px solid var(--acc2);border-radius:8px}
.slogo b{font-size:12.5px;font-weight:800;letter-spacing:.1em}
.slogo small{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.navi{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 14px;border:none;border-radius:12px;
  background:none;color:var(--muted);font:600 13px 'Plus Jakarta Sans';cursor:pointer;transition:.22s;position:relative}
.navi svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.navi:hover{color:var(--text);background:var(--card2)}
.navi.active{background:var(--soft1);color:var(--text)}
.navi.active::before{content:'';position:absolute;left:2px;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--acc1)}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line)}
.themes{display:flex;gap:8px;margin-bottom:10px}
.thdot{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s;
  background:linear-gradient(135deg,var(--d1),var(--d2))}
.thdot:hover{transform:scale(1.15)}
.thdot.active{border-color:var(--text);box-shadow:0 0 10px var(--d1)}
.side-foot small{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
/* ================= MAIN ================= */
.main{flex:1;min-width:0;padding:0 clamp(14px,3vw,30px) 46px}
.mbrand{display:none;align-items:center;gap:11px;padding:14px 2px 0}
.mbrand b{font-size:13px;font-weight:800;letter-spacing:.1em}
.mbrand small{display:block;font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:22px 2px 6px}
.greet h2{font-size:19px;font-weight:700}
.greet p{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip-name{padding:7px 13px;border-radius:999px;font:700 12px 'JetBrains Mono',monospace;border:1px solid var(--line2);
  color:var(--text);background:var(--card)}
.clockchip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font:700 13px 'JetBrains Mono',monospace;color:var(--acc1)}
.clockchip i{width:7px;height:7px;border-radius:50%;background:var(--acc1);box-shadow:0 0 8px var(--acc1);animation:pulse 1.6s infinite}
.clockchip em{font-style:normal;font-size:9px;color:var(--muted);letter-spacing:.14em}
@keyframes pulse{50%{opacity:.35}}
/* mobile tabs */
.mtabs{display:none;position:sticky;top:0;z-index:40;gap:8px;padding:10px 2px;overflow-x:auto;
  background:var(--bg);backdrop-filter:blur(10px)}
.mtab{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);font:600 12px 'Plus Jakarta Sans';letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.2s}
.mtab.active{color:var(--text);border-color:var(--acc1);background:var(--soft1)}
/* ================= KPI ================= */
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);animation:fadeUp .5s both;animation-delay:var(--d,0s);transition:transform .25s,border-color .25s}
.kpi:hover{transform:translateY(-3px);border-color:var(--line2)}
.kpi-lbl{font-size:9.5px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:700}
.kpi-ico{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:10px;background:var(--soft1);
  display:grid;place-items:center}
.kpi-ico svg{width:15px;height:15px;stroke:var(--acc1);fill:none;stroke-width:2;stroke-linecap:round}
.kpi-val{display:flex;align-items:baseline;gap:6px;margin-top:8px;font:700 25px 'JetBrains Mono',monospace;color:var(--text)}
.kpi-val small{font:600 11px 'Plus Jakarta Sans';color:var(--muted);letter-spacing:.08em}
.spark{width:100%;height:26px;margin-top:10px;display:block}
/* ================= CARD & CHART ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2.2vw,22px);
  margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card h2{font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;
  display:flex;align-items:center;gap:8px}
.card h2 .mk{width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--acc1),var(--acc2));flex:none}
.note{font-size:11.5px;color:var(--muted);border-left:2px solid var(--acc1);padding-left:10px;margin-top:12px;line-height:1.6}
.chart{width:100%}
.chart svg{width:100%;height:auto;display:block}
.charts-2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));margin-top:16px}
.chart-title{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:700}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donutsvg{max-width:168px;margin:0 auto}
.cx{font:600 8px 'JetBrains Mono',monospace;fill:var(--muted)}
.cv{font:700 8px 'JetBrains Mono',monospace;fill:var(--text)}
.dv{font:700 15px 'JetBrains Mono',monospace;fill:var(--text)}
/* animasi grafik */
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s .1s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.danim{animation:donut 1s cubic-bezier(.4,0,.2,1) both}
@keyframes donut{from{stroke-dasharray:0 300}}
/* ================= PROFIL ================= */
.profile{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.avatar{width:60px;height:60px;aspect-ratio:1/1;flex:none;position:relative;overflow:hidden;border-radius:16px;
  display:grid;place-items:center;background:var(--soft1);box-shadow:0 0 0 1px var(--line2)}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:16px;display:none}
.avatar span{font:800 17px 'Plus Jakarta Sans';color:var(--acc1)}
.avatar.has img{display:block}
.avatar.has span{display:none}
.profile .lbl{font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;font-weight:700}
.profile h3{font-size:17px;font-weight:700}
.profile p{font-size:12px;color:var(--muted)}
.comp-badge{display:inline-block;margin-top:7px;padding:4px 11px;border-radius:999px;border:1px solid var(--line2);
  background:var(--card2);color:var(--muted);font:700 9px 'Plus Jakarta Sans';letter-spacing:.16em;text-transform:uppercase}
/* ================= FORM & BUTTON ================= */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
label{display:block;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
input,select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--inp);
  color:var(--text);font:500 14px 'JetBrains Mono',monospace;transition:.2s}
input:focus,select:focus{outline:none;border-color:var(--acc1);box-shadow:0 0 0 3px var(--soft1)}
input[type=file]{display:none}
.hint{margin-top:12px;font-size:12px;color:var(--muted);font-style:italic}
.hint.live{font-style:normal;font-family:'JetBrains Mono',monospace;color:var(--acc1);background:var(--soft1);
  border:1px dashed var(--acc1);border-radius:11px;padding:10px 12px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{padding:12px 20px;border-radius:11px;border:1px solid transparent;cursor:pointer;transition:.2s;
  font:700 12px 'Plus Jakarta Sans';letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--acc1);color:var(--btnfg);box-shadow:0 10px 26px -12px var(--acc1)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-ghost{background:transparent;border-color:var(--line2);color:var(--muted)}
.btn-ghost:hover{color:var(--text);border-color:var(--acc1)}
.btn-del{padding:6px 10px;border-radius:9px;border:1px solid rgba(255,92,122,.35);background:rgba(255,92,122,.08);color:#ff9db0;cursor:pointer;transition:.2s;font-size:12px}
[data-theme="porcelain"] .btn-del{color:#c0264a}
.btn-del:hover{background:rgba(255,92,122,.2)}
.btn-edit{padding:6px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--soft1);color:var(--acc1);cursor:pointer;transition:.2s;font-size:12px}
.themebtn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:11px;border:1px solid var(--line);
  background:var(--card2);color:var(--muted);cursor:pointer;font:700 11px 'Plus Jakarta Sans';letter-spacing:.08em;text-transform:uppercase;transition:.2s}
.themebtn i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--d1),var(--d2))}
.themebtn:hover{color:var(--text)}
.themebtn.active{border-color:var(--acc1);color:var(--text);background:var(--soft1)}
.hidden{display:none!important}
/* ================= TABEL ================= */
.tbl-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:420px}
.tbl-wrap::-webkit-scrollbar{height:8px;width:8px}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:560px}
thead th{position:sticky;top:0;z-index:1;text-align:left;padding:11px 12px;font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--thead-fg);background:var(--card2);border-bottom:1px solid var(--line);font-weight:700}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--td);font-family:'JetBrains Mono',monospace}
tbody tr{transition:background .15s}
tbody tr:hover td{background:var(--soft1)}
tbody tr:last-child td{border-bottom:0}
td.empty{text-align:center;color:var(--muted);font-style:italic;padding:26px;font-family:'Plus Jakarta Sans'}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;border:1px solid}
.pill-on{color:var(--acc1);border-color:var(--acc1);background:var(--soft1)}
.pill-off{color:var(--muted);border-color:var(--line);background:var(--card2)}
.linkbtn{background:none;border:none;color:var(--acc1);cursor:pointer;font:700 11px 'Plus Jakarta Sans';letter-spacing:.1em;text-transform:uppercase}
/* ================= SEKSI / FOOTER / TOAST ================= */
.sec{display:none}
.sec.on{display:block}
.sec.on>*{animation:fadeUp .45s both}
.sec.on>*:nth-child(2){animation-delay:.06s}
.sec.on>*:nth-child(3){animation-delay:.12s}
.sec.on>*:nth-child(4){animation-delay:.18s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{margin:26px 0 0;text-align:center;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;line-height:2}
footer .tag{color:var(--acc1);font-weight:800;letter-spacing:.3em}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:99;opacity:0;pointer-events:none;
  padding:12px 22px;border-radius:12px;border:1px solid var(--acc1);background:var(--card);color:var(--text);
  font:600 12.5px 'Plus Jakarta Sans';box-shadow:0 0 30px -10px var(--acc1);transition:.3s}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* ================= RESPONSIVE ================= */
@media (max-width:960px){
  .side{display:none}
  .mbrand{display:flex}
  .mtabs{display:flex}
  .topbar{padding-top:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Premium navigation refinement */
.navi,.mtab{isolation:isolate;overflow:hidden}
.navi::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(100deg,var(--soft1),transparent 72%);opacity:0;transform:translateX(-12px);transition:opacity .28s ease,transform .32s cubic-bezier(.2,.75,.25,1);z-index:-1;pointer-events:none}
.navi.active::after{opacity:1;transform:translateX(0)}
.navi.active::before{height:58%;top:21%;bottom:auto;box-shadow:0 0 14px var(--acc1);animation:navGlow .35s ease both}
@keyframes navGlow{from{transform:scaleY(.35);opacity:.4}to{transform:scaleY(1);opacity:1}}
.mtabs{border-bottom:1px solid var(--line);box-shadow:0 10px 24px -24px var(--acc1)}
.mtab{position:relative;overflow:hidden}
.mtab::after{content:"";position:absolute;left:16px;right:16px;bottom:3px;height:2px;border-radius:4px;background:var(--acc1);transform:scaleX(0);transform-origin:center;transition:transform .28s cubic-bezier(.2,.75,.25,1);box-shadow:0 0 10px var(--acc1)}
.mtab.active::after{transform:scaleX(1)}
.navi:focus-visible,.mtab:focus-visible,.btn:focus-visible,.themebtn:focus-visible{outline:2px solid var(--acc1);outline-offset:3px}
.sec{display:block;position:absolute;visibility:hidden;opacity:0;pointer-events:none;inset:auto auto auto -100000px;width:calc(100% - 2px)}
.sec.on{position:relative;inset:auto;width:auto;visibility:visible;opacity:1;pointer-events:auto;animation:sectionEnter .32s cubic-bezier(.2,.75,.25,1) both}
@keyframes sectionEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card,.kpi{backface-visibility:hidden}
.card{transition:border-color .25s ease,box-shadow .25s ease,transform .25s ease}
.card:hover{border-color:var(--line2)}
.btn,.themebtn,.thdot,.btn-edit,.btn-del{transition:transform .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease}
.btn:focus-visible,.navi:focus-visible,.mtab:focus-visible{scroll-margin:100px}
@media(max-width:960px){
 .mtabs{margin:4px -2px 8px;padding:11px 2px;gap:7px}
 .mtab{padding:9px 14px;white-space:nowrap}
 .sec.on{min-height:45vh}
}
@media(max-width:520px){
 .main{padding-left:12px;padding-right:12px}
 .topbar{align-items:flex-start}
 .greet h2{font-size:17px}
 .clockchip{padding:7px 10px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .kpi{padding:13px;border-radius:14px}
 .kpi-val{font-size:20px}
 .kpi-ico{width:26px;height:26px;top:10px;right:10px}
 .charts-2{grid-template-columns:minmax(0,1fr)}
 .btnrow .btn{flex:1 1 auto}
}
@media(prefers-reduced-motion:reduce){
 .navi::after,.mtab::after{transition:none}
 .sec.on{animation:none}
}


/* ===== IPN NAMATOTA · PRODUCT REDESIGN V2 ===== */
:root{--radius-lg:22px}
body{letter-spacing:-.012em;background-image:radial-gradient(ellipse at 82% 0%,var(--soft1),transparent 36%),radial-gradient(ellipse at 0% 100%,var(--soft2),transparent 30%)}
body::before{opacity:.25}
.app{gap:0}
.side{width:258px;padding:26px 18px;background:color-mix(in srgb,var(--side) 92%,transparent);border-right:1px solid var(--line);box-shadow:12px 0 40px -35px var(--acc1)}
.slogo{padding:4px 9px 28px}
.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,var(--card2),var(--bg));box-shadow:0 7px 24px -12px var(--acc1)}
.slogo b{font-size:11px;letter-spacing:.12em}
.navi{padding:13px 15px;border-radius:13px;font-size:13px}
.navi.active{font-weight:800;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc1) 20%,transparent)}
.main{max-width:1640px;margin-inline:auto;padding:0 clamp(18px,3vw,46px) 52px}
.topbar{padding:30px 2px 18px;align-items:center}
.greet h2{font-size:clamp(21px,2.1vw,28px);letter-spacing:-.045em;font-weight:800}
.greet p{font-size:12px;margin-top:4px;letter-spacing:0}
.chip-name,.clockchip{padding:10px 15px;border-radius:13px;background:var(--card);box-shadow:0 6px 24px -20px var(--acc1)}
.clockchip{border-color:color-mix(in srgb,var(--acc1) 25%,var(--line))}
.mtabs{border:1px solid var(--line);border-radius:16px;padding:8px;margin:0 0 18px;background:var(--card);box-shadow:var(--shadow)}
.mtab{border-color:transparent}
.mtab.active{font-weight:800}
.card{border-radius:var(--radius-lg);padding:clamp(18px,2.2vw,26px);margin-bottom:18px;box-shadow:0 12px 36px -28px rgba(0,0,0,.8),inset 0 1px 0 color-mix(in srgb,var(--text) 3%,transparent)}
.card h2{font-size:11px;letter-spacing:.14em;margin-bottom:18px}
.profile{gap:18px}
.avatar{border-radius:18px;width:68px;height:68px}
.profile h3{font-size:19px;letter-spacing:-.03em}
.comp-badge{letter-spacing:.1em}
.kpis{gap:13px;margin:0 0 18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.kpi{border-radius:19px;padding:19px;background:linear-gradient(150deg,var(--card2),var(--card));box-shadow:0 15px 34px -28px var(--acc1),inset 0 1px 0 color-mix(in srgb,var(--text) 4%,transparent)}
.kpi-lbl{font-size:9px;letter-spacing:.13em;max-width:82%}
.kpi-val{font-size:clamp(22px,2vw,29px);letter-spacing:-.04em}
.kpi-ico{width:34px;height:34px;border-radius:12px}
.grid{gap:15px}
label{letter-spacing:.1em}
input,select{border-radius:12px;min-height:44px;font-size:13px}
.btn{min-height:42px;padding:12px 17px;border-radius:12px;letter-spacing:.055em}
.btn-primary{box-shadow:0 8px 25px -15px var(--acc1)}
.btn-ghost{background:var(--card2)}
.tbl-wrap{border-radius:15px;max-height:460px}
table{font-size:12px}
thead th{padding:13px 14px}
tbody td{padding:13px 14px}
tbody tr:hover td{background:color-mix(in srgb,var(--soft1) 65%,transparent)}
.btn-edit,.btn-del{min-width:34px;min-height:34px}
.note{line-height:1.75}
footer{padding-top:18px;border-top:1px solid var(--line);letter-spacing:.1em}
#toast{bottom:24px;border-radius:14px;backdrop-filter:blur(18px)}
/* More legible states and reduced motion */
:where(button,input,select):focus-visible{outline:2px solid var(--acc1);outline-offset:3px}
input::placeholder{color:var(--muted);opacity:.7}
.empty{padding:38px 20px!important}
@media(min-width:961px){.main{padding-top:4px}.sec.on{max-width:1420px;margin-inline:auto}}
@media(max-width:960px){.main{padding-inline:clamp(12px,3vw,24px)}.topbar{padding-top:20px}.mtabs{top:8px}}
@media(max-width:600px){.topbar{gap:12px}.top-right{width:100%;justify-content:space-between}.chip-name{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clockchip{font-size:12px}.card{border-radius:18px}.profile .btn{padding:10px 12px}.tbl-head{align-items:flex-start}.tbl-head>div{width:100%}#filterSearch{flex:1;min-width:130px}.tbl-head input[type=month]{max-width:155px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}


/* ===== MOBILE LAYOUT FIX: no off-canvas sections / phantom scroll ===== */
@media(max-width:960px){
  .app{min-height:0}
  .main{min-height:0;padding-bottom:24px}
  .sec{display:none;position:relative;inset:auto;width:auto;visibility:visible;opacity:1;pointer-events:auto}
  .sec.on{display:block;position:relative;inset:auto;width:auto;min-height:0;visibility:visible;opacity:1;pointer-events:auto}
  .sec.on>*{animation:fadeUp .3s both}
  .mtabs{position:relative;top:auto;z-index:5}
  footer{margin-top:18px;padding-bottom:8px}
}
@media(max-width:960px) and (prefers-reduced-motion:reduce){
  .sec.on>*{animation:none}
}


/* ===== NAV ANIMATION OPTION 4: ELECTRIC POP ===== */
.mtab{
  position:relative;isolation:isolate;overflow:hidden;
  transform:translateZ(0);
  transition:color .22s ease,background .25s ease,border-color .22s ease,box-shadow .25s ease,transform .18s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.mtab::after{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;
  background:linear-gradient(120deg,var(--acc1),color-mix(in srgb,var(--acc1) 70%,var(--acc2)));
  opacity:0;transform:scale(.82);
  transition:opacity .22s ease,transform .28s cubic-bezier(.18,.82,.25,1);
}
.mtab.active{
  color:var(--bg);border-color:transparent;
  background:transparent;
  box-shadow:0 5px 18px -9px var(--acc1),0 0 0 1px color-mix(in srgb,var(--acc1) 30%,transparent);
  font-weight:800;
  animation:tabElectricPop .32s cubic-bezier(.18,.82,.25,1) both;
}
.mtab.active::after{opacity:1;transform:scale(1)}
.mtab:active{transform:scale(.95)}
.mtab:focus-visible{outline:2px solid var(--acc1);outline-offset:3px}
@keyframes tabElectricPop{
  0%{transform:scale(.94)}
  62%{transform:scale(1.035)}
  100%{transform:scale(1)}
}
/* Smooth section entrance: existing active-state logic remains the source of truth. */
.sec.on>*{animation:tabContentRise .34s cubic-bezier(.2,.72,.2,1) both}
.sec.on>*:nth-child(2){animation-delay:.035s}
.sec.on>*:nth-child(3){animation-delay:.07s}
.sec.on>*:nth-child(4){animation-delay:.105s}
@keyframes tabContentRise{
  from{opacity:0;transform:translate3d(0,9px,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
@media(max-width:960px){
  .mtabs{gap:7px;scrollbar-width:none;overscroll-behavior-x:contain}
  .mtabs::-webkit-scrollbar{display:none}
  .mtab{flex:0 0 auto;min-height:44px;padding:10px 15px;white-space:nowrap}
}
@media(max-width:420px){
  .mtabs{gap:5px}
  .mtab{padding:10px 12px;font-size:11px;letter-spacing:.035em}
}
@media(prefers-reduced-motion:reduce){
  .mtab,.mtab::after{transition:none!important}
  .mtab.active{animation:none!important}
  .sec.on>*{animation:none!important}
}


/* ===== NAV VISUAL CLEANUP: remove stacked tab surfaces ===== */
@media(max-width:960px){
  /* Remove the enclosing card/frame behind the individual tabs. */
  .mtabs{
    border:0!important;border-radius:0!important;
    background:transparent!important;box-shadow:none!important;
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
    padding:8px 0!important;margin:4px 0 14px!important;
    gap:6px!important;
  }
  /* Inactive tabs are labels, not a second row of boxed chips. */
  .mtab{
    background:transparent!important;border-color:transparent!important;
    box-shadow:none!important;
  }
  /* Only the active item receives one intentional surface. */
  .mtab.active{
    color:var(--bg)!important;background:transparent!important;
    border-color:transparent!important;
    box-shadow:0 4px 15px -8px var(--acc1)!important;
  }
  .mtab.active::after{
    inset:0!important;border:0!important;border-radius:999px!important;
    background:linear-gradient(120deg,var(--acc1),color-mix(in srgb,var(--acc1) 70%,var(--acc2)))!important;
    box-shadow:none!important;opacity:1!important;transform:scale(1)!important;
  }
}


/* ===== HOTFIX: improve active tab label readability ===== */
@media(max-width:960px){
  .mtabs .mtab.active{
    color:#eafcff!important;
    background:rgba(31,205,231,.12)!important;
    border:1px solid #35e6f5!important;
    box-shadow:0 4px 16px -7px #20d8ef88!important;
    text-shadow:0 0 8px rgba(53,230,245,.18)!important;
    font-weight:800!important;
  }
  /* Avoid the pseudo-element covering the active label. */
  .mtabs .mtab.active::after{display:none!important;content:none!important}
}
@media(prefers-reduced-motion:reduce){
  .mtabs .mtab.active{animation:none!important}
}
